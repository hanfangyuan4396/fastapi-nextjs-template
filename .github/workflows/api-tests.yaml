name: API Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'api/pytest.ini'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - '.github/workflows/api-tests.yaml'
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'api/pytest.ini'
      - 'api/pyproject.toml'
      - 'api/uv.lock'
      - '.github/workflows/api-tests.yaml'
  merge_group:
    # 当使用 GitHub 合并队列 (Merge Queue) 时触发
    # 目的：在入队后、真正合并到 main 之前再次验证测试，避免集成回归
    # 使用前提：在仓库分支保护中启用“要求合并队列”，并将本工作流的检查设为必需
    branches: [ main ]

jobs:
  test:
    name: Run Pytest (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          uv run pytest -q \
            --cov=./ \
            --cov-report=term-missing \
            --cov-report=json:coverage.json

      - name: Coverage Summary
        if: always()
        run: |
          set -euo pipefail
          TOTAL_COVERAGE=$(uv run python -c 'import json; d=json.load(open("coverage.json")); print(d.get("totals",{}).get("percent_covered_display") or d.get("totals",{}).get("percent_covered") or "")')
          echo "### Test Coverage Summary :test_tube:" >> $GITHUB_STEP_SUMMARY
          if [ -n "$TOTAL_COVERAGE" ]; then
            echo "Total Coverage: ${TOTAL_COVERAGE}%" >> $GITHUB_STEP_SUMMARY
          else
            echo "Total Coverage: N/A" >> $GITHUB_STEP_SUMMARY
          fi
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY || true
