name: Style Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-changes:
    name: Determine changed scopes
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      web-changed: ${{ steps.changes.outputs.web }}
      workflow-changed: ${{ steps.changes.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: main
          filters: |
            api:
              - 'api/**'
              - 'api/pyproject.toml'
              - 'api/uv.lock'
            web:
              - 'web/**'
            workflow:
              - '.github/workflows/style.yaml'

  python-style:
    name: API Ruff Style
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.api-changed == 'true' || needs.check-changes.outputs.workflow-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.8"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Sync dependencies
        working-directory: api
        run: uv sync --frozen

      - name: Ruff check
        working-directory: api
        run: |
          uv run ruff --version
          uv run ruff check .
          uv run ruff format --check .

      - name: Lint hints
        if: failure()
        run: |
          echo '请在 api 目录运行: uv run ruff check --fix . && uv run ruff format . 来自动修复可修复的问题。'
          echo '若仍有未修复的问题，请根据 Ruff 的输出逐项手动修复剩余问题。'


  web-eslint:
    name: Web ESLint
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.web-changed == 'true' || needs.check-changes.outputs.workflow-changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies (npm)
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint -- .

      - name: Lint hints
        if: failure()
        run: |
          echo '请在 web 目录运行: npm run lint -- --fix . 来自动修复可修复的问题。'
          echo '若仍有未修复的问题，请根据 ESLint 输出逐项手动修复剩余问题。'
